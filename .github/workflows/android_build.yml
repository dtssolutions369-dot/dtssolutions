name: Build DTS Solutions AAB and APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Inject Production Environment Variables
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://xuzpwgsqaiaowmrzzrbo.supabase.co" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1enB3Z3NxYWlhb3dtcnp6cmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMzc4MjcsImV4cCI6MjA4NTYxMzgyN30.EnDCJpCfpTP-dN3dLE2dpH96ylgQJ7wtHzd_cGHBxEY" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1enB3Z3NxYWlhb3dtcnp6cmJvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MDAzNzgyNywiZXhwIjoyMDg1NjEzODI3fQ.ILeqYyEmWr0lGr1NpBF5I3mrxlC-Y9afJSLWSX9PuYM" >> .env
          echo "RAZORPAY_KEY_ID=rzp_test_SlDl2RlSCBfONB" >> .env
          echo "RAZORPAY_KEY_SECRET=JK3YGA3SEvwrOcshoT08ALWq" >> .env
          echo "NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_test_SlDl2RlSCBfONB" >> .env
          echo "SHIPROCKET_EMAIL=${{ secrets.SHIPROCKET_EMAIL }}" >> .env
          echo "SHIPROCKET_PASSWORD=${{ secrets.SHIPROCKET_PASSWORD }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli
          npm install
          npm install @capacitor/android @capacitor/core

      - name: Build Web Application
        run: npm run build

      - name: Ensure Android Assets Directory Exists
        run: |
          mkdir -p out
          mkdir -p android/app/src/main/assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 --decode > android/app/release.keystore

      - name: Build and Sign Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DTS-Solutions-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DTS-Solutions-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab